<style>
  :root{

    --lilac:#c9b6ff;

    --mint:#9ee6c9;
    --mint-soft:#d6f5e8;
    --cream:#fff7fb;
    --butter:#fff2c9;
    --ink:#6b4c63;
    --ink-soft:#9a7e92;

    --red:#ff7a8a;

  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Quicksand',sans-serif;
    background:

      radial-gradient(circle at 88% 12%, #e4dcff 0, transparent 40%),
      radial-gradient(circle at 80% 85%, #d6f5e8 0, transparent 45%),
      radial-gradient(circle at 18% 90%, #fff2c9 0, transparent 40%),

    min-height:100vh;
    color:var(--ink);
    padding:24px 14px 60px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* ---- Header ---- */
  .topcard{
    background:#fff;
    border:3px solid var(--pink-soft);
    border-radius:32px;
    padding:26px 24px 22px;
    text-align:center;
    box-shadow:0 14px 0 -4px var(--shadow), 0 20px 40px -18px var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .topcard::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,transparent 0 18px,rgba(255,214,227,.18) 18px 20px);
    pointer-events:none;
  }
  h1{
    font-family:'Baloo 2',cursive;
    font-size:clamp(26px,7vw,38px);
    line-height:1.05;
    color:var(--pink);
    text-shadow:2px 2px 0 #fff,4px 4px 0 var(--pink-soft);

  .badges{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px;position:relative;}
  .badge{

    padding:5px 12px;border-radius:20px;color:#fff;
  }
  .b1{background:var(--pink);}
  .b2{background:var(--lilac);}
  .b3{background:var(--mint);}
  .b4{background:#ffc04d;}

  /* ---- Progress ---- */
  .progress-shell{margin:18px auto 14px;position:relative;}
  .pbar-bg{height:18px;background:#fff;border:3px solid var(--lilac-soft);border-radius:30px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.05);}
  .pbar-fill{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,var(--pink),var(--lilac),var(--mint));transition:width .45s cubic-bezier(.34,1.56,.64,1);}
  .pmeta{display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:8px;padding:0 4px;}
  .pmeta .score{color:var(--green);}

  /* ---- Question Card ---- */
  .card{
    background:#fff;border:3px solid var(--pink-soft);border-radius:28px;
    padding:24px 22px 26px;margin-top:14px;
    box-shadow:0 12px 0 -4px var(--shadow),0 22px 40px -22px var(--shadow);
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }

  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .qnum{
    font-family:'Baloo 2';font-weight:800;font-size:15px;color:#fff;
    background:var(--lilac);padding:5px 14px;border-radius:18px;white-space:nowrap;

  .qtext{font-family:'Baloo 2';font-weight:600;font-size:19px;line-height:1.35;color:var(--ink);margin-bottom:18px;}

  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{
    display:flex;align-items:center;gap:12px;
    background:var(--cream);border:3px solid var(--lilac-soft);
    border-radius:18px;padding:13px 15px;cursor:pointer;
    font-weight:600;font-size:15px;color:var(--ink);

    text-align:left;
  }
  .opt:hover{transform:translateY(-2px);border-color:var(--lilac);background:#fff;}
  .opt .letter{
    flex:none;width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;font-family:'Baloo 2';font-weight:700;
    background:#fff;border:2px solid var(--lilac);color:var(--lilac);font-size:14px;
  }
  .opt.correct{border-color:var(--green);background:var(--mint-soft);}
  .opt.correct .letter{background:var(--green);border-color:var(--green);color:#fff;}
  .opt.wrong{border-color:var(--red);background:#ffe7ea;}
  .opt.wrong .letter{background:var(--red);border-color:var(--red);color:#fff;}
  .opt.locked{cursor:default;pointer-events:none;}
  .opt.dim{opacity:.5;}

  .feedback{
    margin-top:16px;border-radius:18px;padding:14px 16px;font-weight:700;
    font-size:15px;display:none;animation:pop .35s ease;
  }
  .feedback.show{display:block;}
  .feedback.yay{background:var(--mint-soft);color:var(--green);border:2px dashed var(--green);}
  .feedback.nay{background:#ffe7ea;color:var(--red);border:2px dashed var(--red);}

  .next-btn{
    margin-top:18px;width:100%;border:none;cursor:pointer;
    font-family:'Baloo 2';font-weight:700;font-size:18px;color:#fff;
    background:var(--pink);padding:15px;border-radius:20px;
    box-shadow:0 6px 0 #e76f93;transition:transform .12s,box-shadow .12s;
    display:none;
  }
  .next-btn.show{display:block;animation:pop .3s ease;}
  .next-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e76f93;}

  /* ---- Result ---- */
  .result{display:none;text-align:center;}
  .result.show{display:block;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
  .result .emoji{font-size:74px;line-height:1;animation:bounce 1.4s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-14px) rotate(4deg);}}
  .result h2{font-family:'Baloo 2';font-size:32px;color:var(--pink);margin:10px 0 4px;text-shadow:2px 2px 0 var(--pink-soft);}
  .scorebig{font-family:'Baloo 2';font-weight:800;font-size:56px;color:var(--lilac);margin:6px 0;}
  .result p{font-weight:600;color:var(--ink-soft);font-size:16px;margin-bottom:6px;}
  .restart{
    margin-top:22px;border:none;cursor:pointer;font-family:'Baloo 2';font-weight:700;
    font-size:18px;color:#fff;background:var(--mint);padding:15px 32px;border-radius:22px;
    box-shadow:0 6px 0 #5ec8a0;transition:transform .12s,box-shadow .12s;
  }
  .restart:active{transform:translateY(4px);box-shadow:0 2px 0 #5ec8a0;}

  .footer{text-align:center;margin-top:26px;font-size:12px;font-weight:600;color:var(--ink-soft);opacity:.8;}
  .floaty{position:fixed;font-size:22px;pointer-events:none;opacity:.55;animation:float 9s ease-in-out infinite;z-index:0;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-22px) rotate(12deg);}}
</style>

let idx=0, score=0, answered=false;
const quizArea=document.getElementById('quizArea');
const pbar=document.getElementById('pbar');
const pcount=document.getElementById('pcount');
const pscore=document.getElementById('pscore');
const LETTERS=['A','B','C','D'];

function render(){
  const Q=QUESTIONS[idx];
  answered=false;
  pbar.style.width=((idx)/QUESTIONS.length*100)+'%';
  pcount.textContent=`Question ${idx+1} of ${QUESTIONS.length}`;
  pscore.textContent=score;

  let opts='';
  Q.o.forEach((t,i)=>{
    opts+=`<button class="opt" data-i="${i}" onclick="choose(${i})">
      <span class="letter">${LETTERS[i]}</span><span>${t}</span></button>`;
  });

  quizArea.innerHTML=`
    <div class="card">
      <div class="qtop">
        <span class="qnum">Q${idx+1}</span>
        <span class="qchap">${Q.c}</span>
      </div>
      <div class="qtext">${Q.q}</div>
      <div class="opts" id="opts">${opts}</div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="next()">
        ${idx===QUESTIONS.length-1?'See My Results 🎀':'Next Question →'}
      </button>
    </div>`;
}

function choose(i){
  if(answered) return;
  answered=true;
  const Q=QUESTIONS[idx];
  const opts=document.querySelectorAll('.opt');
  const fb=document.getElementById('feedback');
  opts.forEach((el,j)=>{
    el.classList.add('locked');
    if(j===Q.a) el.classList.add('correct');
    else if(j===i) el.classList.add('wrong');
    else el.classList.add('dim');
  });
  if(i===Q.a){
    score++;
    pscore.textContent=score;
    fb.className='feedback yay show';
    fb.innerHTML=pick(['🌟 Yay! Correct!','💖 Perfect!','✨ You got it!','🎉 Nailed it!','🌸 Brilliant!']);
  }else{
    fb.className='feedback nay show';
    fb.innerHTML=`💔 Oops! The correct answer is <u>${LETTERS[Q.a]}. ${Q.o[Q.a]}</u>`;
  }
  document.getElementById('nextBtn').classList.add('show');
}

function pick(a){return a[Math.floor(Math.random()*a.length)];}

function next(){
  if(idx<QUESTIONS.length-1){ idx++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else showResult();
}

function showResult(){
  document.getElementById('progressShell').style.display='none';
  quizArea.innerHTML='';
  pbar.style.width='100%';
  const res=document.getElementById('result');
  res.classList.add('show');
  document.getElementById('resScore').textContent=score;
  const pct=Math.round(score/QUESTIONS.length*100);
  document.getElementById('resPct').textContent=`That's ${pct}% correct!`;
  let emoji,title,msg;
  if(pct>=90){emoji='🏆';title='Superstar!';msg='You absolutely aced it! Future top nurse right here. 💕';}
  else if(pct>=75){emoji='🌟';title='Amazing!';msg='Great work — you really know your stuff!';}
  else if(pct>=50){emoji='🌸';title='Nice job!';msg='Solid effort! A little more review and you\u2019ll shine.';}
  else{emoji='🌱';title='Keep going!';msg='Every expert started here. Review and try again — you\u2019ve got this!';}
  document.getElementById('resEmoji').textContent=emoji;
  document.getElementById('resTitle').textContent=title;
  document.getElementById('resMsg').textContent=msg;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){
  idx=0;score=0;answered=false;
  document.getElementById('result').classList.remove('show');
  document.getElementById('progressShell').style.display='block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
